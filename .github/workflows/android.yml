name: Android CI

on:
  push:
    branches:
      - main
      - principal

  pull_request:
    branches:
      - main
      - principal

  workflow_dispatch:

# Variables globales del entorno de GitHub Actions
env:
  GIT_CLONE_PROTECTION_ACTIVE: false

jobs:
  build:
    name: Build Sonic Generations Android
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout SIN submódulos
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ---------------------------------------------------------
      # 2. Configurar JDK 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # ---------------------------------------------------------
      # 3. Localizar Gradle Wrapper
      # ---------------------------------------------------------
      - name: Locate Gradle wrapper
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . \
            -type f \
            -name "gradlew" \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::No se encontró ningún archivo gradlew."
            exit 1
          fi

          GRADLEW="${GRADLEW#./}"

          echo "Gradle wrapper encontrado:"
          echo "$GRADLEW"

          chmod +x "$GRADLEW"

          echo "GRADLEW_PATH=$GRADLEW" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 4. Buscar android_sdk.sh
      # ---------------------------------------------------------
      - name: Locate Android SDK setup script
        shell: bash
        run: |
          set -e

          SDK_SCRIPT=$(find . \
            -type f \
            -name "android_sdk.sh" \
            -not -path "*/build/*" \
            | head -n 1 || true)

          if [ -n "$SDK_SCRIPT" ]; then
            SDK_SCRIPT="${SDK_SCRIPT#./}"

            echo "Script Android SDK encontrado:"
            echo "$SDK_SCRIPT"

            chmod +x "$SDK_SCRIPT"

            echo "ANDROID_SDK_SCRIPT=$SDK_SCRIPT" >> "$GITHUB_ENV"
          else
            echo "No se encontró android_sdk.sh."
            echo "Se utilizará el Android SDK del runner."
          fi

      # ---------------------------------------------------------
      # 5. Preparar Android SDK
      # ---------------------------------------------------------
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_SDK_SCRIPT:-}" ] \
             && [ -f "$ANDROID_SDK_SCRIPT" ]; then

            echo "Ejecutando:"
            echo "$ANDROID_SDK_SCRIPT"

            "./$ANDROID_SDK_SCRIPT"
          else
            echo "android_sdk.sh no está presente."
            echo "Continuando con el SDK preinstalado."
          fi

      # ---------------------------------------------------------
      # 6. Verificar entorno Android
      # ---------------------------------------------------------
      - name: Verify Android build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not-set}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not-set}"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK platforms:"
          ls -la \
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" \
            || true

          echo ""
          echo "Android NDK:"
          ls -la \
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk" \
            || true

          echo ""
          echo "CMake:"
          ls -la \
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmake" \
            || true

          echo ""
          echo "Gradle:"
          echo "$GRADLEW_PATH"

      # ---------------------------------------------------------
      # 7. Compilar APK Release
      # ---------------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          GRADLE_FILE=$(basename "$GRADLEW_PATH")

          echo "Directorio Gradle:"
          echo "$GRADLE_DIR"

          cd "$GRADLE_DIR"

          echo "Iniciando compilación Release..."

          "./$GRADLE_FILE" \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ---------------------------------------------------------
      # 8. Localizar APK generado
      # ---------------------------------------------------------
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Buscando APK Release..."

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::No se encontró ningún APK Release."

            echo ""
            echo "APK encontrados en el repositorio:"
            find . -type f -name "*.apk" || true

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 9. Subir APK
      # ---------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Generations-Optimized-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7