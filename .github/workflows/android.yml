name: Android CI

on:
  push:
    branches: [ "main", "principal" ]
  pull_request:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for tools
      run: chmod +x tools/android_sdk.sh android/gradlew

    - name: Download ReXGlue Android SDK
      run: ./tools/android_sdk.sh

    - name: Build Release APK with Gradle
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic-Generations-Optimized-APK
        path: android/app/build/outputs/apk/release/app-release.apk
