name: Android CI

on:
  push:
    branches:
      - main
      - principal
  pull_request:
    branches:
      - main
      - principal
  workflow_dispatch:

env:
  GIT_CLONE_PROTECTION_ACTIVE: false

jobs:
  build:
    name: Build Sonic Generations Android
    runs-on: ubuntu-24.04

    steps:
      # 1. Clonar el repositorio principal sin submódulos rotos
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # 2. Configurar el entorno de Java 17 oficial
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # 3. Dar permisos y localizar el ejecutable Gradle del juego
      - name: Locate and Prepare Gradle wrapper
        shell: bash
        run: |
          set -e
          GRADLEW=$(find . -type f -name "gradlew" -not -path "*/build/*" | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::No se encontró ningún archivo gradlew."
            exit 1
          fi
          GRADLEW="${GRADLEW#./}"
          chmod +x "$GRADLEW"
          echo "GRADLEW_PATH=$GRADLEW" >> "$GITHUB_ENV"

      # 4. Compilar directamente el APK Release ignorando scripts externos
      - name: Build Release APK
        shell: bash
        run: |
          set -e
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          GRADLE_FILE=$(basename "$GRADLEW_PATH")
          cd "$GRADLE_DIR"
          ./$GRADLE_FILE assembleRelease --no-daemon --stacktrace --warning-mode all

      # 5. Localizar el instalador APK generado en la nube
      - name: Locate generated APK
        shell: bash
        run: |
          set -e
          APK=$(find . -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No se encontró ningún APK Release."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 6. Subir el APK final para su descarga directa al celular
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Generations-Optimized-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
