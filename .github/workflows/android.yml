name: Android CI

on:
  push:
    branches:
      - main
      - principal

  pull_request:
    branches:
      - main
      - principal

  workflow_dispatch:

jobs:
  build:
    name: Build Sonic Generations Android
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # 1. Descargar el repositorio
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle


      # ---------------------------------------------------------
      # 3. Localizar Gradle Wrapper
      # ---------------------------------------------------------
      - name: Locate Gradle wrapper
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . -type f -name "gradlew" \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::No se encontró ningún archivo gradlew en el repositorio."
            exit 1
          fi

          GRADLEW="${GRADLEW#./}"

          echo "Gradle wrapper encontrado en: $GRADLEW"

          chmod +x "$GRADLEW"

          echo "GRADLEW_PATH=$GRADLEW" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # 4. Buscar android_sdk.sh sin asumir una ruta
      # ---------------------------------------------------------
      - name: Locate Android SDK setup script
        shell: bash
        run: |
          set -e

          SDK_SCRIPT=$(find . -type f -name "android_sdk.sh" \
            -not -path "*/build/*" \
            | head -n 1 || true)

          if [ -n "$SDK_SCRIPT" ]; then
            SDK_SCRIPT="${SDK_SCRIPT#./}"

            echo "Script Android SDK encontrado en:"
            echo "$SDK_SCRIPT"

            chmod +x "$SDK_SCRIPT"

            echo "ANDROID_SDK_SCRIPT=$SDK_SCRIPT" >> "$GITHUB_ENV"
          else
            echo "No se encontró android_sdk.sh."
            echo "Se utilizará el Android SDK preinstalado en GitHub Actions."
          fi


      # ---------------------------------------------------------
      # 5. Preparar Android SDK
      # ---------------------------------------------------------
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_SDK_SCRIPT:-}" ] && [ -f "$ANDROID_SDK_SCRIPT" ]; then
            echo "Ejecutando:"
            echo "$ANDROID_SDK_SCRIPT"

            "./$ANDROID_SDK_SCRIPT"
          else
            echo "android_sdk.sh no está presente."
            echo "Continuando con el SDK proporcionado por GitHub Actions."
          fi


      # ---------------------------------------------------------
      # 6. Mostrar herramientas disponibles
      # ---------------------------------------------------------
      - name: Verify Android build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID BUILD ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          adb version || true

          echo ""
          echo "SDK platforms:"
          ls -la "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" || true

          echo ""
          echo "NDK:"
          ls -la "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk" || true

          echo ""
          echo "CMake:"
          ls -la "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmake" || true

          echo ""
          echo "Gradle wrapper:"
          echo "$GRADLEW_PATH"


      # ---------------------------------------------------------
      # 7. Compilar Release
      # ---------------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          GRADLE_FILE=$(basename "$GRADLEW_PATH")

          echo "Entrando en:"
          echo "$GRADLE_DIR"

          cd "$GRADLE_DIR"

          echo "Ejecutando:"
          echo "./$GRADLE_FILE assembleRelease"

          "./$GRADLE_FILE" \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ---------------------------------------------------------
      # 8. Buscar APK generado
      # ---------------------------------------------------------
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Buscando APK..."

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::No se encontró ningún APK Release."
            echo ""
            echo "Archivos APK disponibles:"
            find . -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # 9. Subir APK como Artifact
      # ---------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Generations-Optimized-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7