name: Android CI

on:
push:
branches:
- main
- principal
pull_request:
branches:
- main
- principal
workflow_dispatch:

env:
GIT_CLONE_PROTECTION_ACTIVE: false
GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
build:
name: Build Sonic Generations Android ARM64
runs-on: ubuntu-24.04

steps:

  # =========================================================
  # 1. Descargar el proyecto
  # =========================================================
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
      submodules: false

  # =========================================================
  # 2. Java 17
  # =========================================================
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: "17"
      distribution: "temurin"
      cache: "gradle"

  # =========================================================
  # 3. Dependencias del sistema
  # =========================================================
  - name: Install build dependencies
    shell: bash
    run: |
      set -euxo pipefail

      sudo apt-get update

      sudo apt-get install -y \
        git \
        curl \
        wget \
        unzip \
        zip \
        pkg-config \
        libx11-xcb-dev \
        libusb-1.0-0-dev \
        libgtk-3-dev \
        ninja-build \
        cmake \
        ccache

  # =========================================================
  # 4. Configurar Android SDK
  # =========================================================
  - name: Configure Android SDK
    shell: bash
    run: |
      set -euxo pipefail

      SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

      if [ -z "$SDK_ROOT" ]; then
        echo "::error::Android SDK no encontrado."
        exit 1
      fi

      echo "Android SDK: $SDK_ROOT"

      SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

      if [ ! -x "$SDKMANAGER" ]; then
        echo "::error::No se encontró sdkmanager:"
        echo "$SDKMANAGER"
        exit 1
      fi

      yes | "$SDKMANAGER" --licenses >/dev/null || true

      "$SDKMANAGER" \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "ndk;27.2.12479018" \
        "cmake;3.31.1"

      echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

  # =========================================================
  # 5. Preparar el script oficial del proyecto
  #
  # El repositorio actualmente tiene android_sdk.sh en la
  # raíz, pero el propio script calcula ROOT suponiendo que
  # está dentro de tools/.
  #
  # Lo colocamos temporalmente en tools/ para que sus rutas
  # queden correctamente apuntando al repositorio.
  # =========================================================
  - name: Prepare ReXGlue Android SDK script
    shell: bash
    run: |
      set -euxo pipefail

      if [ ! -f "$GITHUB_WORKSPACE/android_sdk.sh" ]; then
        echo "::error::No existe android_sdk.sh en la raíz."
        exit 1
      fi

      mkdir -p "$GITHUB_WORKSPACE/tools"

      cp \
        "$GITHUB_WORKSPACE/android_sdk.sh" \
        "$GITHUB_WORKSPACE/tools/android_sdk.sh"

      chmod +x \
        "$GITHUB_WORKSPACE/tools/android_sdk.sh"

      echo "Script preparado:"
      ls -l "$GITHUB_WORKSPACE/tools/android_sdk.sh"

  # =========================================================
  # 6. Preparar ReXGlue SDK + parches + SDL3 + libadrenotools
  # =========================================================
  - name: Setup ReXGlue Android SDK
    shell: bash
    run: |
      set -euxo pipefail

      cd "$GITHUB_WORKSPACE"

      ./tools/android_sdk.sh \
        "$GITHUB_WORKSPACE/android/sdk/rexglue-sdk"

      echo
      echo "===== ReXGlue SDK ====="
      test -f "$GITHUB_WORKSPACE/android/sdk/rexglue-sdk/.patches-applied"
      echo "SDK preparado correctamente."

      echo
      echo "===== libadrenotools ====="
      test -f "$GITHUB_WORKSPACE/android/sdk/libadrenotools/CMakeLists.txt"
      echo "libadrenotools preparado correctamente."

      echo
      echo "===== SDL3 Java ====="
      test -d "$GITHUB_WORKSPACE/android/app/src/main/java/org/libsdl/app"
      echo "SDL3 Java glue preparado correctamente."

  # =========================================================
  # 7. Verificar dependencias nativas
  #
  # Esto evita volver a llegar hasta CMake para descubrir
  # que pkg-config no puede encontrar las bibliotecas host.
  # =========================================================
  - name: Verify native build dependencies
    shell: bash
    run: |
      set -euxo pipefail

      echo "===== pkg-config ====="
      pkg-config --version

      echo
      echo "===== x11-xcb ====="
      pkg-config --modversion x11-xcb

      echo
      echo "===== libusb ====="
      pkg-config --modversion libusb-1.0

      echo
      echo "===== CMake ====="
      cmake --version

      echo
      echo "===== Ninja ====="
      ninja --version

      echo
      echo "===== Clang ====="
      clang++ --version

  # =========================================================
  # 8. Configurar ccache
  # =========================================================
  - name: Configure ccache
    shell: bash
    run: |
      set -euxo pipefail

      ccache --max-size=2G

      echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      echo "CCACHE_DIR=$HOME/.cache/ccache"
      ccache --show-config

  # =========================================================
  # 9. Cache de compilación nativa
  # =========================================================
  - name: Cache native compilation
    uses: actions/cache@v4
    with:
      path: |
        ~/.cache/ccache
        android/.cxx
      key: sonic-generations-android-${{ runner.os }}-${{ hashFiles('port/**', 'android/src/main/cpp/**', 'android/app/build.gradle.kts', 'android/CMakeLists.txt') }}
      restore-keys: |
        sonic-generations-android-${{ runner.os }}-

  # =========================================================
  # 10. Preparar Gradle
  # =========================================================
  - name: Prepare Gradle
    shell: bash
    run: |
      set -euxo pipefail

      GRADLEW="$GITHUB_WORKSPACE/android/gradlew"

      if [ ! -f "$GRADLEW" ]; then
        echo "::error::No se encontró android/gradlew."
        exit 1
      fi

      chmod +x "$GRADLEW"

      echo "Gradle wrapper:"
      "$GRADLEW" --version

  # =========================================================
  # 11. Limpiar compilación anterior
  # =========================================================
  - name: Clean build
    shell: bash
    run: |
      set -euxo pipefail

      cd "$GITHUB_WORKSPACE/android"

      ./gradlew clean \
        --no-daemon \
        --stacktrace

  # =========================================================
  # 12. Compilar Sonic Generations PC recompilado
  #     para Android ARM64
  # =========================================================
  - name: Build Release APK
    shell: bash
    env:
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: "2G"
    run: |
      set -euxo pipefail

      cd "$GITHUB_WORKSPACE/android"

      ./gradlew assembleRelease \
        -PrexName=sonicgenerations \
        -PrexPortDir="$GITHUB_WORKSPACE/port" \
        -PrexSdkDir="$GITHUB_WORKSPACE/android/sdk/rexglue-sdk" \
        --no-daemon \
        --stacktrace \
        --info \
        --warning-mode all

  # =========================================================
  # 13. Buscar APK
  # =========================================================
  - name: Locate APK
    shell: bash
    run: |
      set -euxo pipefail

      APK_DIR="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release"

      APK="$(find "$APK_DIR" \
        -type f \
        -name "*.apk" \
        -print \
        | head -n 1 || true)"

      if [ -z "$APK" ]; then
        echo "::error::No se generó ningún APK."
        echo
        echo "Contenido de outputs:"
        find "$GITHUB_WORKSPACE/android/app/build/outputs" \
          -maxdepth 5 \
          -type f \
          -print || true
        exit 1
      fi

      echo "APK generado:"
      ls -lh "$APK"

      echo "APK_PATH=$APK" >> "$GITHUB_ENV"

  # =========================================================
  # 14. Subir APK
  # =========================================================
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Sonic-Generations-Android-ARM64
      path: ${{ env.APK_PATH }}
      if-no-files-found: error
      retention-days: 14

  # =========================================================
  # 15. Guardar logs si el build falla
  # =========================================================
  - name: Upload build diagnostics
    if: failure()
    uses: actions/upload-artifact@v4
    with:
      name: Sonic-Generations-build-diagnostics
      path: |
        android/app/.cxx/**
        android/app/build/outputs/logs/**
        android/.gradle/**
      if-no-files-found: ignore
      retention-days: 7