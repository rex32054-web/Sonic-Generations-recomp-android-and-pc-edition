name: Android CI

"on":
  push:
    branches:
      - principal
      - main
  pull_request:
    branches:
      - principal
      - main
  workflow_dispatch:

env:
  GIT_CLONE_PROTECTION_ACTIVE: "false"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
  build:
    name: Build Sonic Generations Android
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            pkg-config \
            libx11-xcb-dev \
            libusb-1.0-0-dev \
            libgtk-3-dev \
            ninja-build \
            cmake \
            ccache

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.1"

      - name: Prepare Android SDK script
        run: |
          mkdir -p tools
          cp android_sdk.sh tools/android_sdk.sh
          chmod +x tools/android_sdk.sh

      - name: Setup ReXGlue SDK
        run: |
          ./tools/android_sdk.sh "$GITHUB_WORKSPACE/android/sdk/rexglue-sdk"

      - name: Verify dependencies
        run: |
          pkg-config --version
          pkg-config --modversion x11-xcb
          pkg-config --modversion libusb-1.0
          cmake --version
          ninja --version

      - name: Prepare Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --version

      - name: Clean
        run: |
          cd android
          ./gradlew clean --no-daemon --stacktrace

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PrexName=sonicgenerations \
            -PrexPortDir="$GITHUB_WORKSPACE/port" \
            -PrexSdkDir="$GITHUB_WORKSPACE/android/sdk/rexglue-sdk" \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Generations-Android-ARM64
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error