name: Android CI

on:
  push:
    branches:
      - main
      - principal

  pull_request:
    branches:
      - main
      - principal

  workflow_dispatch:

env:
  GIT_CLONE_PROTECTION_ACTIVE: false

jobs:
  build:
    name: Build Sonic Generations Android
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. Checkout SIN submódulos del proyecto principal
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # =========================================================
      # 3. Dependencias Linux
      # =========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            unzip \
            zip \
            pkg-config \
            libx11-xcb-dev \
            libusb-1.0-0-dev \
            ninja-build \
            cmake

      # =========================================================
      # 4. Configurar Android SDK
      # =========================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK no encontrado."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager no encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.1"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # =========================================================
      # 5. Descargar ReXGlue SDK v0.10.0
      # =========================================================
      - name: Download ReXGlue SDK v0.10.0
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p sdk
          rm -rf sdk/rexglue-sdk

          git clone \
            --depth 1 \
            --branch v0.10.0 \
            https://github.com/rexglue/rexglue-sdk.git \
            sdk/rexglue-sdk

          cd sdk/rexglue-sdk

          echo "ReXGlue SDK descargado:"
          git rev-parse HEAD

      # =========================================================
      # 6. Inicializar dependencias del SDK
      # =========================================================
      - name: Initialize ReXGlue SDK dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd sdk/rexglue-sdk

          git submodule sync --recursive
          git submodule update --init --recursive

      # =========================================================
      # 7. Aplicar parche gráfico
      # =========================================================
      - name: Apply ReXGlue Android graphics patch
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="$GITHUB_WORKSPACE/android/patches/rexglue-sdk-v0.10.0.patch"
          SDK="$GITHUB_WORKSPACE/sdk/rexglue-sdk"

          if [ ! -f "$PATCH" ]; then
            echo "::error::No existe el parche:"
            echo "$PATCH"
            exit 1
          fi

          if [ ! -d "$SDK" ]; then
            echo "::error::No existe el SDK:"
            echo "$SDK"
            exit 1
          fi

          cd "$SDK"

          echo "Comprobando parche..."

          git apply --check "$PATCH"

          echo "Aplicando parche..."

          git apply "$PATCH"

          echo "Parche aplicado correctamente."

          git diff --stat

      # =========================================================
      # 8. Preparar Gradle
      # =========================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euxo pipefail

          GRADLEW="$GITHUB_WORKSPACE/android/gradlew"

          if [ ! -f "$GRADLEW" ]; then
            echo "::error::No se encontró android/gradlew."
            exit 1
          fi

          chmod +x "$GRADLEW"

      # =========================================================
      # 9. Limpiar compilaciones anteriores
      # =========================================================
      - name: Clean Gradle and native build
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/android"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 10. Compilar APK Release
      # =========================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/android"

          ./gradlew assembleRelease \
            -PrexName=sonicgenerations \
            -PrexPortDir="$GITHUB_WORKSPACE/port" \
            -PrexSdkDir="$GITHUB_WORKSPACE/sdk/rexglue-sdk" \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all

      # =========================================================
      # 11. Localizar APK
      # =========================================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -euxo pipefail

          APK=$(find \
            "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "::error::No se generó ningún APK."
            exit 1
          fi

          echo "APK generado:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # =========================================================
      # 12. Subir APK
      # =========================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Generations-Optimized-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7